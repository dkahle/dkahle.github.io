project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"
    # Blog is on hold; sources are kept in blog/ for when it comes back.
    # To restore: drop this exclusion and re-add the navbar entry below.
    - "!blog/**"
  resources:
    - cv.pdf
    - og-image.png

website:
  title: "David Kahle"
  site-url: "https://www.kahle.io"
  # Default social preview for pages that don't set their own `image`.
  # Generated by R/og-image.R. The leading slash matters: written bare, Quarto
  # resolves it per-page, so /research/ ends up advertising an og:image at
  # research/og-image.png, which does not exist.
  image: /og-image.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  page-footer: "© 2025 - 2026 David Kahle | Made with Quarto"
  navbar:
    left:
      - text: Research
        href: research/index.qmd
      - text: Software
        href: software/index.qmd
      - text: Talks
        href: talks/index.qmd
      - text: CV
        href: cv.pdf
    right:
      - icon: github
        href: https://github.com/dkahle
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/david-j-kahle
        aria-label: LinkedIn
      - icon: twitter-x
        href: https://x.com/davidjkahle
        aria-label: Twitter/X

format:
  html:
    theme: [flatly, styles.scss]
    link-external-newwindow: true

